/* ---- oyun kabuğu: tarayıcı hissi yerine mobil oyun ---- */
:root{--bg:#d6dfe9;--edge:#b3c0cf;--hi:rgba(255,255,255,.9);--hud:linear-gradient(180deg,#1d3156,#0f1b31)}

html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:var(--bg)}
input,select,textarea,#invL{-webkit-user-select:text;user-select:text}

in:0\">Kalıcıdır; diğer oyuncular seni bu adla tanır. Sonradan sadece mağazadan alınan hakla değişir.<\/p>":"<h2>Wie soll dein Autohaus heißen?<\/h2><input type=\"text\" id=\"nick1\" maxlength=\"18\" placeholder=\"z. B. Stern Automobile\" aria-label=\"Name des Autohauses\" style=\"padding:12px\"><p class=\"small mute\" style=\"margin:0\">Der Name bleibt; andere Spieler kennen dich darunter. Ändern geht später nur mit einem Recht aus dem Shop.<\/p>","<h2>Hangi şehirden oynuyorsun?<\/h2><p class=\"small mute\" style=\"margin:0\">Bir kez soruyoruz. Oyuncuların nereden oynadığını görüp oyunu ona göre geliştiriyoruz; seçersen şehrin sıralamada adının altında da görünür. Konumuna erişmiyoruz.<\/p>\n      <select id=\"city1\" style=\"font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px\">":"<h2>Aus welcher Region spielst du?<\/h2><p class=\"small mute\" style=\"margin:0\">Wir fragen nur einmal. So sehen wir, wo gespielt wird, und verbessern das Spiel; wenn du wählst, steht deine Region auch in der Rangliste unter deinem Namen. Auf deinen Standort greifen wir nicht zu.<\/p>\n      <select id=\"city1\" style=\"font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px\">","<\/select>\n      <button class=\"btn\" data-a=\"city1\">Kaydet<\/button><button class=\"btn alt\" data-a=\"city0\">Söylemek istemiyorum<\/button>":"<\/select>\n      <button class=\"btn\" data-a=\"city1\">Speichern<\/button><button class=\"btn alt\" data-a=\"city0\">Möchte ich nicht sagen<\/button>","Gizlilik ve şartlar":"Datenschutz & Bedingungen","<div class=\"card small\" style=\"display:flex;flex-direction:column;gap:10px\">\n      <div><strong>Hangi bilgileri tutuyoruz?<\/strong><br>Galeri adın, oyun ilerlemen (kasa, arabalar, seviye), sıralama için servetin ve haftalık kârın, davet kodun, kimin davetiyle geldiğin, bildirirsen şehrin, cihazının saat diliminden çıkan ülken ve cihazın  Händlername, Vermögen, Stufe, Verkaufszahl und – falls gewählt – deine Stadt sind in der Rangliste für andere sichtbar. Land und Gerätetyp sieht nur der Betreiber des Spiels. Autos, die du in die Händlerbörse stellst, und ihre Preise sind ebenfalls sichtbar. Alles andere gehört nur dir.<\/div>\n      <div><strong>Käufe<\/strong><br>Spielgeld aus dem Shop gilt nur im Spiel, kann nicht in echtes Geld oder anderes umgetauscht und nicht erstattet werden. Gekauftes Geld zählt nicht zum Vermögen in der Rangliste. In dieser Version wird nichts berechnet.<\/div>\n      <div><strong>Regeln<\/strong><br>Cheats oder Bots, fremde Konten und beleidigende, hetzerische oder fremde Personen imitierende Händlernamen sind verboten; solche Konten können aus der Rangliste entfernt werden.<\/div>\n      <div><strong>Daten löschen<\/strong><br>Mit einer Insolvenz setzt du das Spiel zurück. Soll dein Eintrag komplett gelöscht werden, wende dich an den Herausgeber.<\/div>\n      <div><strong>Über das Spiel<\/strong><br>Galerici ist ein Spiel. Automodelle, Preise und Ereignisse sind erfunden; es besteht keine Verbindung zu echten Firmen.<\/div><\/div><button class=\"btn\" data-a=\"close\">OK<\/button>","1. Ucuza al":"1. Günstig kaufen","Pazar sekmesinde sahibinden ilanlar düşer. Satıcının sözüne güvenme: ekspertiz yaptır, sonra pazarlık et. Acil satanlar ve işten anlamayanlar en iyi fırsattır.":"Im Tab Markt tauchen Privatangebote auf. Glaub dem Verkäufer nicht alles: Lass ein Gutachten machen, dann verhandle. Eilige Verkäufer und Ahnungslose sind die besten Deals.","2. Değerini artır":"2. Wert steigern","Kötü parça için teklif al: yetkili servis pahalı ama garantili, sanayi orta, hurdacının çıkma parçası çok ucuz ama garantisiz. Çıkma parça sende ya da müşteride bozulabilir.":"Hol Angebote für kaputte Teile: Vertragswerkstatt teuer mit Garantie, freie Werkstatt mittel, Gebrauchtteil vom Schrottplatz spottbillig ohne Garantie. Gebrauchtteile können bei dir oder beim Kunden kaputtgehen.","3 <div><strong>Kurallar<\/strong><br>Hileli ya da otomatik araçlarla oynamak, başkasının hesabını kullanmak ve galeri adında küfür, hakaret ya da başkasını taklit eden ifadeler yasaktır; bu durumda hesap sıralamadan çıkarılabilir.<\/div>\n      <div><strong>Verini silmek<\/strong><br>İflas bildirerek oyunu sıfırlayabilirsin. Kaydının tamamen silinmesini istersen yayıncıya başvurman yeterli.<\/div>\n      <div><strong>Oyun hakkında<\/strong><br>Galerici bir oyundur. Arabaların adları, fiyatları ve olaylar kurgudur; gerçek bir şirketle bağlantısı yoktur.<\/div><\/div><button class=\"btn\" data-a=\"close\">Tamam<\/button>":"<div class=\"card small\" style=\"display:flex;flex-direction:column;gap:10px\">\n      <div><strong>What data do we keep?<\/strong><br>Your dealer name, your game progress (cash, cars, level), your net worth and weekly profit for the leaderboard, your invite code, whose invite you came with, your city if you share it, the country from your device's time zone and your device type (e.g. \"iPhone · iOS 18\"). This is kept to run and improve the game. We don't collect your location, phone number, device ID, email or contacts.<\/div>\n      <div><strong>Who sees it?<\/strong><br>Your dealer name, net worth, level, sales count and, if chosen, your city are visible on the leaderboard. Your country and device type are visible only to the game's operator. Cars you put on the dealer exchange and their prices are visible too. Everything else is yours alone.<\/div>\n      <div><strong>Purchases<\/strong><br>Game money from the shop can only be used in the game, can't be exchanged for real money or anything else, and is non-refundable. Bought money doesn't count toward leaderboard net worth. This version charges nothing.<\/div>\n      <div><strong>Rules<\/strong><br>Cheating or automated tools, using someone else's account, and dealer names with swearing, insults or impersonation are not allowed; such accounts may be removed from the leaderboard.<\/div>\n      <div><strong>Deleting your data<\/strong><br>You can reset the game by declaring bankruptcy. To have your record fully deleted, just contact the publisher.<\/div>\n      <div><strong>About the game<\/strong><br>Galerici is a game. Car names, prices and events are fictional; it has no connection to any real company.<\/div><\/div><button class=\"btn\" data-a=\"close\">OK<\/button>","1. Ucuza al":"1. Buy cheap","Pazar sekmesinde sahibinden ilanlar düşer. Satıcının sözüne güvenme: ekspertiz yaptır, sonra pazarlık et. Acil satanlar ve işten anlamayanlar en iyi fırsattır.":"Private listings pop up in the Market tab. Don't trust the seller's word: get an inspection, then haggle. Sellers in a hurry and clueless ones are the best deals.","2. Değerini artır":"2. Add value","Kötü parça için teklif al: yetkili servis pahalı ama garantili, sanayi orta, hurdacının çıkma parçası çok ucuz ama garantisiz. Çıkma parça sende ya da müşteride bozulabilir.":"Get quotes for bad parts: the dealer service is pricey with a warranty, an independent garage is mid-range, a used part from the scrapyard is dirt cheap with no warranty. Used parts can fail with you or with the buyer.","3. Pahalıya sat":"3. Sell high","Arabayı ilana koy. Fiyat piyasaya yakınsa müşteri çabuk gelir. Gelen müşteriyle pazarlık et; fazla zorlarsan gider.":"List the car. If the price is close to market, buyers come fast. Haggle with them; push too hard and they leave.","4. Dürüst mü, kurnaz mı?":"4. Honest or sly?","Arabayı alan herkes yorum yazar. Kusuru gizleyip pahalıya satabilirsin, ama ortaya çıkarsa tek yıldız yersin ve itibarın düşer. Kötü yorumu masrafı karşılayarak düzeltebilirsin.":"Every buyer writes a review. You can hide faults and sell higher, but if it comes out you get one star and your reputation drops. You can fix bad reviews by covering the costs.","Galericiler borsası":"Dealer exchange","Pazar sekmesinde diğer oyuncuların ve rakip galerilerin arabaları var; sen de stoktaki arabanı borsaya koyup başka oyunculara satabilirsin, sen oyunda olmasan da para yatar.":"The Market tab has cars from other players and rival dealers; you can also put your stock on the exchange and sell to other players, and get paid even when you're offline.","Her gün":"Every day","Günlük ödülünü al ve 3 günlük görevi bitir. Arka arkaya girersen ödül 7 güne kadar büyür.":"Collect your daily reward and finish 3 daily tasks. Play several days in a row and the reward grows up to day 7.","Yurt dışı ve özel plaka":"Imports and special plates","Mahalle Galerisi olunca yurt dışından araba getirebilirsin. Pazar sekmesinde her gün özel plakalar açık artırmaya çıkar.":"Once you're a Neighborhood Dealer you can import cars. Special plates are auctioned every day in the Market tab.","Dikkat: haciz ve çalıntı":"Watch out: liens and stolen cars","Çok ucuz ve acil ilanlarda haciz ya da çalıntı ihbarı olabilir. Almadan önce sorgula.":"Very cheap and urgent listings may have a lien or a theft report. Check before you buy.","Modifiye, restorasyon, taksit":"Mods, restoration, installments","Gençler modifiyeli arabaya fazla öder. Hurda klasikleri 4 aşamada restore et, koleksiyoncuya sat. Taksitle satış daha pahalıya gider ama ödemeyen çıkabilir.":"Young buyers pay more for modded cars. Restore wrecked classics in 4 stages and sell them to collectors. Installment sales fetch more, but some buyers stop paying.","Kulüp ve vitrin":"Clubs and showroom","Sıralama sekmesinden kulüp kur ya da katıl. Şirket sekmesinden vitrinini süsle; diğer oyuncular galerini ziyaret edebilir.":"Found or join a club in the Ranking tab. Decorate your showroom in the Company tab; other players can visit your dealership.","5. Büyü":"5. Grow","Kira her gün işler (üstteki sarı çizgi bir gün). İtibar ve para biriktikçe galeriyi büyüt, ekip kur, ihalelere gir. Piyasa haberlerini izle: düşükken al, yüksekken sat.":"Rent runs every day (the yellow bar on top is one day). As reputation and cash grow, expand your lot, hire a team, join auctions. Wat e code and who invited you are stored on Apple’s iCloud servers (CloudKit). We only know you by an anonymous iCloud ID that is unique to this game; we never see your name, email or Apple account. Your messages are visible to other players. We review reported messages and remove rule-breakers from the chat.","Bildirimler":"Notifications","Bildirimler sadece senin izninle, telefonunun kendisinde planlanır; hiçbir sunucuya gönderilmez. Telefonunun Ayarlar bölümünden istediğin zaman kapatabilirsin.":"Notifications are only scheduled with your permission, on your phone itself; nothing is sent to a server. You can turn them off any time in your phone’s Settings.","Silme ve iletişim":"Deletion and contact","Sohbet mesajlarının ya da davet kaydının silinmesini istersen bize yaz:":"To have your chat messages or invite record deleted, write to us:","Gizlilik politikasının tamamı":"Full privacy policy","iCloud yedeği alındı.":"iCloud backup saved.","Yedekleme için iPhone ayarlarından iCloud’a giriş yapmalısın.":"To back up, sign in to iCloud in your iPhone settings.","Yedeklenemedi, biraz sonra tekrar dene.":"Backup failed, try again shortly.","Yedek geri yüklenemedi.":"Could not restore the backup.","iCloud yedekleme":"iCloud backup","Kapalı. Telefon değişirse ya da oyunu silersen ilerlemen kaybolur.":"Off. If you change phones or delete the app, your progress is lost.","iCloud’a bağlanılıyor…":"Connecting to iCloud…","Son yedek: ":"Last backup: ","Henüz yedek yok.":"No backup yet.","Şimdi yedekle":"Back up now","Yedeği geri yükle":"Restore backup","iCloud yedeğin var":"You have an iCloud backup","Bu Apple hesabında daha önceki bir oyunun yedeği bulundu:":"A backup of an earlier game was found in this Apple account:",". gün":". day","Geri yüklersen şu anki oyunun yerine yedekteki oyun gelir.":"Restoring replaces your current game with the backup.","Ayarlarda açıksa oyun kaydın kendi iCloud hesabındaki özel alana yedeklenir; telefon değiştirince ya da oyunu silip yükleyince geri gelir. Bu yedeği biz göremeyiz.":"If backup is on in Settings, your save is backed up to the private area of your own iCloud account and comes back after a phone change or reinstall. We cannot see this backup.","Kullanım istatistikleri ve çökme raporları":"Usage statistics and crash reports","Oyunu geliştirmek için Google Analytics for Firebase ile kullanım istatistikleri (açılan ekranlar, seviye, satın alma ve reklam olayları, cihaz modeli, yaklaşık ülke) ve Firebase Crashlytics ile çökme raporları toplarız. Avrupa’da bu ancak reklam izni penceresinde izin verirsen olur; kararını aynı yerden değiştirebilirsin.":"To improve the game we collect usage statistics with Google Analytics for Firebase (screens opened, level, purchase and ad events, device model, approximate country) and crash reports with Firebase Crashlytics. In Europe only with your consent in the ad privacy window, where you can also change it.","Oyunun kaydı cihazında, istersen kendi iCloud hesabında tutulur. Adını, e-postanı ya da Apple hesabını toplamıyoruz. Oyunda Google AdMob reklamları gösterilir: Google reklam için cihaz tanımlayıcısı ve kullanım bilgilerini işleyebilir. Avrupa’da önce iznin sorulur. Reklamsız oyunu alırsan ara reklamlar kapanır.":"Your save is kept on your device and, if you like, in your own iCloud account. We don’t collect your name, email or Apple account. The game shows ads from Google AdMob: Google may process device identifiers and usage data for this. In Europe you’re asked for consent first. Buying the ad-free game turns off ads between play."}};
